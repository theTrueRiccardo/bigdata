<script src="https://cdn.amcharts.com/lib/4/core.js"></script>
<script src="https://cdn.amcharts.com/lib/4/charts.js"></script>
<script src="https://cdn.amcharts.com/lib/4/themes/animated.js"></script>


<form [formGroup]="formData" (ngSubmit)="onClickSubmit(formData.value)" class="box">

  <label for="inputId" class="sr-only">Id</label>
  <input type="text" id="id" class="form-control" formControlName="id" placeholder="Id" required autofocus>
  <button class="button is-info"  type="submit">Start</button>
</form>
<br>
<br>
<div id="loading" style="display: none">
  <progress class="progress is-small is-primary" max="100">30%</progress>
</div>
<br>
<h2 class="title is-2" >{{totaleRilevazioni}}</h2>
<br>
<br>
<br>
<div class="columns">
  <div class="column">
    <div id="chartdiv2"></div>
  </div>
  <div class="column">
    <div id="chartdiv1"></div>
  </div>
</div>
<br>
<br>
<h3 class="subtitle is-3" style="text-align:center;" > {{scheda?.msgConfrontoGiornoNotte}}</h3>
<br>
<div id="chart"></div>
<br>
<br>
<h3 class="subtitle is-3" style="text-align:center;"  > Distanza totale: {{scheda?.km?.toFixed(2)}} km</h3>
<h3 class="subtitle is-3" style="text-align:center;" > Incasso totale: {{scheda?.yuan?.toFixed(2)}} ¥ </h3>
<br>
<br>
<br>
<mat-tab-group (selectedIndexChange)="visibile($event)">
  <mat-tab label="2/2/2008">
  </mat-tab>
  <mat-tab label="3/2/2008"  >
  </mat-tab>
  <mat-tab label="4/2/2008">
  </mat-tab>
  <mat-tab label="5/2/2008">
  </mat-tab>
  <mat-tab label="6/2/2008">
  </mat-tab>
  <mat-tab label="7/2/2008">
  </mat-tab>
  <mat-tab label="8/2/2008">
  </mat-tab>
</mat-tab-group>


<div id="chartdivs0" [style.display]="visible[0] ? 'block' : 'none'"></div>
<div id="chartdivs1"[style.display]="visible[1] ? 'block' : 'none'"></div>
<div id="chartdivs2"[style.display]="visible[2] ? 'block' : 'none'"></div>
<div id="chartdivs3"[style.display]="visible[3] ? 'block' : 'none'"></div>
<div id="chartdivs4"[style.display]="visible[4] ? 'block' : 'none'"></div>
<div id="chartdivs5"[style.display]="visible[5] ? 'block' : 'none'"></div>
<div id="chartdivs6"[style.display]="visible[6] ? 'block' : 'none'"></div>
